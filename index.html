<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>


    <div class="start-screen screen"> 
        
        <p>This dirty kitchen is full of flies use the swatter to get rid of them.</p>
        <p>Move the swatter with the mouse and click to bring the swatter down and squish them. </p>
        <P> BE QUICK!! you only have 20 seconds to squish them all!!!</P>


        <button class="start-btn">start game</button>
    </div>
    
     <div class="game-screen screen">
        <div class="timer-box"><span id= "timer" > 00:30  </span></div>
        <div id="gameOver"></div>
    </div>
    <div id="Timer "></div>
    <div class="end-screen-lose">
        <div class="end-screen-lose-content">
           
        
            <button class="try-again-btn"> Try again</button>
        </div>
    </div>
    
    </div>
<div class="end-screen-win">
        <div class="end-screen-win-content">
            
        
            <button class="go-to-start-btn"> Play again </button>
        </div>
        </div>
    <script src="./js/index.js"></script>
    <script src="./js/fly.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/fly-swatter.js"></script>
</body>

</html>
